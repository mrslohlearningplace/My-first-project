<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topic Worksheet — Maths Tools Portal</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js"></script>
  <script src="../data/papers.js"></script>
  <script src="../data/question-images.js"></script>
  <script src="../js/topic-worksheet.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="../index.html">← Back to all tools</a>
    <button type="button" class="theme-toggle" aria-pressed="false">Dark theme</button>
  </header>

  <main>
    <h1>Topic Worksheet</h1>
    <p class="intro">Pick a topic to get every past-paper question on it, ready to practise or print.</p>

    <form id="worksheet-form" class="filters worksheet-controls">
      <label class="filter">Topic <select name="topic"></select></label>
      <label class="filter">Year <select name="year"></select></label>
      <button type="button" class="button" id="print-button">Print worksheet</button>
    </form>

    <section id="worksheet" class="worksheet" aria-live="polite"></section>
  </main>
</body>
</html>
